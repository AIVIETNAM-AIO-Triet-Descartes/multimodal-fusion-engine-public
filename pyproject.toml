[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfe"
version = "0.1.0"
description = "Multimodal Fusion Engine - video retrieval for AIC 2026"
readme = "README.md"
license = { file = "LICENSE" }
# Pinned per docs/01 §3.1 ("Ghi rõ Python version").
# Upper bound: faiss-cpu / torch wheels lag behind new CPython releases.
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Split by workstream so Nhật Bảo/Vỹ Triết can run the validator and eval harness
# without installing torch. See docs/00 §2 for the ownership map.
offline = [
    "av>=12.0",
    "opencv-python>=4.9",
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "ultralytics>=8.1",
]
stores = [
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "rank-bm25>=0.2.2",
]
online = [
    "mfe[stores]",
    "sentence-transformers>=2.5",
]
browser = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
all = ["mfe[offline,stores,online,browser,dev]"]

[project.scripts]
mfe-ingest = "mfe.offline.ingest:main"
mfe-eval = "mfe.eval.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "stub: test targets a NotImplementedError stub; xfail until the owner implements it",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
