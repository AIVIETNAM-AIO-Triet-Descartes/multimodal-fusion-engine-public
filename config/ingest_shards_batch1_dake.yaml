# CHỈ TRÍCH KEYFRAME BẰNG DAKE — batch 1 (873 video), chia 5 người theo ZIP
# docs/triet/ke-hoach-offline-ingest.md §3, §5.6, §10.2
#
# ═══════════════════════════════════════════════════════════════════════════
# QUYẾT ĐỊNH CỦA LEAD (18-08-2026): dùng keyframe DAKE và **tự chạy detector**
# trên chính bộ keyframe đó. KHÔNG dùng lại `objects/` của BTC — nó đánh địa
# chỉ theo keyframe BTC nên không nói gì về keyframe của ta (§1.2).
#
# Bộ keyframe BTC vẫn có thể được nạp **về sau, vào một Modal Volume KHÁC**, để
# so hiệu năng với DAKE (§3.7). Đó là việc riêng, không phải việc bây giờ, và
# nó phải nằm ở volume/bundle khác — một bundle chỉ chứa một bộ keyframe.
# ═══════════════════════════════════════════════════════════════════════════
#
# NGUỒN DỮ LIỆU: tải trực tiếp từ `aic-data.ledo.io.vn`, **ẩn danh, không cần
# xác thực** (dataset_report.md §A.1). Không Google Drive, không rclone, không
# token nào. Đo được: 14 file `Videos_*.zip`, tổng 77,29 GB, đúng 873 video.
#
# VÌ SAO CHIA THEO ZIP chứ không theo video: BTC gom video thành 14 gói. Chia
# theo video thì video của mỗi người rải khắp 14 gói, và **ai cũng phải tải gần
# hết 77 GB** — đúng thứ mà chia việc sinh ra để tránh.

bundle: aic_dake_p1_b1_v1
keyframe_set: dake
calibration_video: L21_V001

assign: zips
zip_inventory: config/zips_batch1.yaml

# Một tầng. Thêm tầng vào đây là quay lại bài toán quota GPU ở §10.1 — N1 là
# tầng DUY NHẤT không cần GPU.
#
# Bước kế tiếp đã chốt là `n4_objects` chạy trên chính bộ keyframe này, nhưng nó
# cần TensorFlow + GPU nên đi bằng notebook khác (`00-master`), sau khi N1 xong.
stages:
  - n1_keyframes

# ═══════════════════════════════════════════════════════════════════════════
# THAM SỐ DAKE — PHƯƠNG ÁN P1, Lead chốt 19-08-2026
# `notebooks/dake/hieu-chinh-tham-so-dake.md` §4 (số đo) và §7 (quyết định)
#
# ĐÂY LÀ NGUỒN DUY NHẤT. Notebook đọc từ file này, không khai lại hằng số trong
# ô đầu — năm người sửa năm bản sao là đúng thứ `check_fingerprints` tồn tại để
# bắt, và nó chỉ bắt được SAU khi cả batch đã chạy xong.
# ═══════════════════════════════════════════════════════════════════════════
#
# Quét trên 20 video / 424.818 frame. Đổi so với bản 18-08 (0,015 / 3,0s / 5f):
#
#   rho              0,015 -> 0,020   (VỀ LẠI giá trị của paper)
#   max_gap_seconds  3,0s  -> 8,0s
#   min_gap          5 frame -> 1,0 GIÂY
#
# Hướng đi mới là chỗ đáng nhớ: **tăng rho mà tổng số keyframe lại GIẢM.**
# 8.692 thay vì 13.205, trong đó phần do nội dung chọn TĂNG từ 6.361 lên 8.486.
# Lý do: luật mật độ là phần **mù nội dung** — nó chèn frame chỉ để chặn khoảng
# trống, tức lấy mẫu đều đội lốt DAKE — và ở cấu hình cũ nó sinh ra 52% đầu ra.
# Hạ `rho` là cắt đúng phần LÀ DAKE và giữ phần không phải.
#
# Vì sao 3,0s sai: nó được chọn vì "chặt hơn khoảng cách trung vị 3,36s của BTC"
# — so một CHẶN TRÊN với một TRUNG VỊ. BTC trung vị 3,36s nghĩa là một nửa
# khoảng của họ dài hơn thế, nên chặn cứng 3,0s DÀY HƠN BTC trên toàn bộ nửa
# trên phân bố của họ. Muốn so được thì mốc phải đặt gần MAX của họ (210 frame
# = 7,0–8,4s tuỳ fps). Ở 8,0s, khoảng cách trung vị của ta (1,44s) vẫn dày hơn
# BTC — chặn chỉ kích hoạt ở đoạn tĩnh, đúng việc của nó.
#
# TẮT HẲN luật mật độ thì KHÔNG dùng được: đo được khoảng trống tới 324 giây.
#
# `min_gap_seconds` là cần gạt không có trong paper và cũng không có trong bất kỳ
# trao đổi nào trước 19-08. Ở 5 frame (0,20s), **36% khoảng cách keyframe dưới
# nửa giây** — trùng lặp mà không quyết định nội dung nào yêu cầu, chỉ vì thuật
# toán ĐƯỢC PHÉP lấy hai frame cách nhau 5. Ở 1,0s còn 1–3%, và đó là lý do
# Lead hoãn được cả việc lọc trùng (quyết định 4).
#
# Đơn vị là GIÂY cho cả hai (quyết định 5): 25 frame là 1,00s @25fps nhưng 0,83s
# @30fps, mà batch 1 có 781 video @25fps và 92 video ở ba fps khác.
params:
  n1_keyframes:
    rho: 0.020
    max_gap_seconds: 8.0
    min_gap_seconds: 1.0
