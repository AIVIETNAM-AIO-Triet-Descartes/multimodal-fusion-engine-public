schema_version: 2
ledger_id: keyframe-augmentation-math-call-sites-2026-08-30
scope: >-
  Every frame identity, timestamp, budget, endpoint, and downstream boundary
  touched by the augmentation path or its BTC ingestion/submission neighbors.
  Scores/latencies rounded only for presentation are not frame identity.
required_operations:
  frame_idx_from_pts: floor(pts_time * literal_fps)
  frame_idx_from_decoder_pts: floor(decoder_pts_time * locked_literal_fps)
  timestamp_ms: round(pts_time * 1000)
  hard_delta_budget: floor(btc_count * guardrail_ratio)
  k_target_and_min_gap: ceil
  max_gap_frame_cap: floor
  transnet_endpoint: zero_based_inclusive
  btc_identity: copy_map_keyframes_csv_frame_idx
call_sites:
  - {file: src/mfe/contracts/ids.py, line_or_symbol: frame_idx_from_pts, input_quantity: pts_time_seconds+literal_fps, output_quantity: frame_idx, current_operation: math.floor, required_operation: floor(pts_time*fps), boundary_invariant: CSV frame_idx is canonical and literal FPS is used, counterexample: round(1893.66*29.97) differs from CSV, test_id: test_mapping_rejects_round_instead_of_floor, status: correct}
  - {file: src/mfe/contracts/ids.py, line_or_symbol: pts_time_to_timestamp_ms, input_quantity: pts_time_seconds, output_quantity: timestamp_ms, current_operation: round(pts_time*1000), required_operation: round(pts_time*1000), boundary_invariant: milliseconds are display/time contract and do not derive frame identity, counterexample: round(pts_time*fps) incorrectly used for frame_idx, test_id: test_timestamp_ms_round_is_a_separate_contract, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate0.py, line_or_symbol: audit_mapping_math, input_quantity: CSV pts_time/fps/frame_idx, output_quantity: floor_and_round_audit_counts, current_operation: computes both without writing, required_operation: floor is validation; round is counterfactual only, boundary_invariant: source column is never replaced, counterexample: 1152 round mismatches in sample audit, test_id: test_mapping_math_audit_preserves_csv_identity_and_measures_counterfactual_round, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate0.py, line_or_symbol: read_and_validate_mapping, input_quantity: mapping CSV, output_quantity: BtcFrame, current_operation: copies frame_idx then independently floor-validates, required_operation: copy canonical frame_idx and reject floor mismatch, boundary_invariant: duplicate aliases retain lowest ordinal for identity set, counterexample: duplicate n or wrong round-derived frame, test_id: test_mapping_contract_uses_literal_fps_floor_and_collapses_btc_aliases, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate1.py, line_or_symbol: classify_shot, input_quantity: inclusive shot length/target gap, output_quantity: k_target/coverage_class, current_operation: ceil(duration/target_gap), required_operation: ceil, boundary_invariant: minimum coverage target cannot round down, counterexample: 2.01 seconds target gap 2 would otherwise under-request, test_id: test_transnet_audit_classifies_c0_c1_ct_ce_and_covered, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate1.py, line_or_symbol: _interior, input_quantity: seconds margin/ratio cap/fps, output_quantity: integer interior bounds, current_operation: ceil seconds margin and floor ratio cap then min, required_operation: ceil minimum margin + floor hard cap, boundary_invariant: transition margin is conservative without removing over configured ratio, counterexample: fps 29.97 at 0.25 seconds, test_id: test_interior_margin_ceil_seconds_floor_ratio_cap, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate1.py, line_or_symbol: _farthest_frame, input_quantity: inclusive integer frame bounds, output_quantity: candidate frame_idx, current_operation: //2 midpoint and integer gap midpoints, required_operation: integer frame coordinate with no FPS conversion, boundary_invariant: endpoint is inclusive and protected BTC frames are excluded, counterexample: one-frame shot or all frames protected, test_id: test_transnet_scene_endpoints_are_inclusive, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate1.py, line_or_symbol: equalize_budget, input_quantity: BTC count and ratio and four pools, output_quantity: locked hard delta budget plus per-arm deficits, current_operation: floor hard budget then truncate each arm independently, required_operation: floor ratio; expose underfill and block primary A/B, boundary_invariant: no arm exceeds hard cap and matched-underfill stays secondary, counterexample: shrinking every arm to a one-candidate pool hides a requested budget of 3, test_id: test_hard_budget_floors_ratio_and_never_exceeds_cap, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/gate1.py, line_or_symbol: build_oracles, input_quantity: inclusive GT interval and BTC frame set, output_quantity: O1-T missing slice and O1-S full interval manifests, current_operation: integer midpoint only as diagnostic reference, required_operation: O1-T temporal-missing only; O1-S every event; no headroom inference, boundary_invariant: BTC-covered event still enters O1-S, counterexample: temporal_coverage_headroom=0 but representative/rank unknown, test_id: test_temporal_coverage_does_not_suppress_representative_oracle, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/oracle.py, line_or_symbol: OracleEvidenceRow.gt_interval_inclusive, input_quantity: event start/end, output_quantity: inclusive interval tuple, current_operation: Pydantic validation end>=start, required_operation: inclusive non-negative interval, boundary_invariant: source frame search includes both endpoints, counterexample: exclusive end drops one-frame GT, test_id: test_oracle_interval_is_inclusive, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/oracle.py, line_or_symbol: OracleEvidenceRow.failure_stage, input_quantity: stage evidence, output_quantity: failure stage enum, current_operation: Literal validation, required_operation: temporal|representation|retrieval|fusion|reranker|scorer|none, boundary_invariant: missing artifact is blocked status, not a guessed stage, counterexample: no feature artifact labeled retrieval failure, test_id: test_blocked_oracle_row_does_not_infer_stage_scores, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/bundle.py, line_or_symbol: build_delta_bundle decoder loop, input_quantity: decoder frame counter and decoder PTS, output_quantity: supplemental frame_idx/pts_time, current_operation: counter is identity; decoder PTS floor-checked against literal FPS; fallback interval, required_operation: floor decoder PTS only when it agrees; fail closed otherwise, boundary_invariant: BTC mapping rows are copied unchanged, counterexample: VFR or decoder timebase disagreement, test_id: test_delta_bundle_provenance_dedup_determinism_and_rollback, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/bundle.py, line_or_symbol: _provenance_rows, input_quantity: supplemental frame and BTC bracket, output_quantity: provenance mapping/interpolation error, current_operation: interpolation only diagnostic; frame_idx remains decoder counter, required_operation: preserve frame identity and record bracket warnings, boundary_invariant: no interpolation can rewrite a frame ID, counterexample: candidate overtakes canonical bracket, test_id: test_delta_bundle_provenance_dedup_determinism_and_rollback, status: correct}
  - {file: src/mfe/offline/keyframe_augmentation/transnet.py, line_or_symbol: predictions_to_scenes_adapter, input_quantity: transition predictions, output_quantity: start_frame/end_frame, current_operation: upstream zero-based inclusive adapter, required_operation: zero-based inclusive, boundary_invariant: last frame is covered when no transition, counterexample: one-frame clip and terminal scene, test_id: test_transnet_no_transition_covers_last_frame, status: correct}
  - {file: src/mfe/offline/dake.py, line_or_symbol: select_keyframes budget, input_quantity: rho and frame count, output_quantity: selector count, current_operation: floor(rho*n) initial pass then density fill may exceed it, required_operation: if rho is declared a hard budget then floor must cap final output; otherwise rename it initial content budget, boundary_invariant: unresolved because max-gap guarantee currently outranks ratio, counterexample: density fill pushes count above floor(rho*n), test_id: test_density_rule_can_push_the_count_above_the_budget, status: ambiguous}
  - {file: src/mfe/offline/dake.py, line_or_symbol: select_keyframes spacing, input_quantity: min_gap_seconds/max_gap_seconds/fps, output_quantity: min_gap_frames/window, current_operation: ceil minimum and floor maximum, required_operation: ceil lower bound and floor upper cap, boundary_invariant: min gap is conservative; max gap is not overshot, counterexample: 29.97fps one-second gap, test_id: test_the_bound_holds_in_seconds_not_frames, status: correct}
  - {file: src/mfe/offline/dake.py, line_or_symbol: pts_for_frame, input_quantity: frame_idx/fps/decimal precision, output_quantity: pts_time, current_operation: ceil to decimal grid then round only timestamp representation, required_operation: returned PTS must satisfy floor(pts*fps)==frame_idx, boundary_invariant: PTS interval belongs to requested frame, counterexample: round(frame_idx/fps,4) lands below boundary, test_id: test_round_trips_through_the_contract, status: correct}
  - {file: src/mfe/offline/stages.py, line_or_symbol: read_keyframes, input_quantity: BTC mapping CSV, output_quantity: Keyframe, current_operation: copies frame_idx then floor-validates, required_operation: copy canonical identity, boundary_invariant: stage N1 cannot re-index BTC, counterexample: wrong FPS read from video, test_id: test_produces_a_mapping_its_own_reader_accepts, status: correct}
  - {file: src/mfe/offline/stages.py, line_or_symbol: stage_n1_keyframes, input_quantity: selected decoder counter, output_quantity: supplemental mapping row, current_operation: pts_for_frame(index,fps) and index, required_operation: decoder counter identity plus floor-roundtrip PTS, boundary_invariant: output mapping is deterministic and source-tagged, counterexample: round(index/fps,4), test_id: test_frame_thresholds_are_facts_not_params, status: correct}
  - {file: src/mfe/offline/stages.py, line_or_symbol: _quad_to_box, input_quantity: OCR floating polygon coordinates, output_quantity: integer pixel box, current_operation: int(floor(min)) and int(ceil(max)), required_operation: floor top-left and ceil bottom-right before integer box, boundary_invariant: geometry rounding must contain the detected text, counterexample: int(round()) clips a boundary pixel, test_id: test_ocr_box_floor_ceil_contains_polygon, status: correct}
  - {file: src/mfe/offline/keyframes.py, line_or_symbol: extract_keyframes, input_quantity: BTC map rows, output_quantity: KeyframeRow/AssetRecord, current_operation: copies CSV frame_idx and n separately, required_operation: copy CSV identity; collapse same frame_idx aliases, boundary_invariant: keyframe ID uses frame_idx while image path uses ordinal n, counterexample: treating n as frame_idx, test_id: test_equal_frame_idx_rows_collapse_at_ingest, status: correct}
  - {file: scripts/build_btc_relational.py, line_or_symbol: rows_for, input_quantity: map-keyframes CSV, output_quantity: relational BTC rows, current_operation: best row by smallest n per frame_idx; timestamp round only, required_operation: preserve frame_idx and ordinal distinction, boundary_invariant: duplicate frame IDs are collapsed deterministically, counterexample: two rows mint same keyframe ID, test_id: test_build_btc_relational_rounds_timestamp_ms_by_contract, status: correct}
  - {file: scripts/build_sample_2026_records.py, line_or_symbol: collect_records, input_quantity: map CSV and embeddings, output_quantity: sample records, current_operation: floor validation and row-aligned embedding lookup, required_operation: canonical frame_idx and source row alignment, boundary_invariant: no embedding dimension equality claim without fingerprint, counterexample: shifted array row, test_id: test_builder_filters_labels_normalizes_text_and_records_checksums, status: correct}
  - {file: scripts/ingest_btc_vectors.py, line_or_symbol: iter_records, input_quantity: vectors and map CSV, output_quantity: BTC ingest records, current_operation: floor validation and exact vector row alignment, required_operation: same, boundary_invariant: ingest rejects blank/wrong frame identity, counterexample: recompute with round, test_id: test_vector_ingest_requires_canonical_frame_idx_column, status: correct}
  - {file: src/mfe/eval/official.py, line_or_symbol: candidate_frame_id/to_*_submissions, input_quantity: keyframe_id and RelationalMap, output_quantity: official frame_id submission, current_operation: read relational frame_idx; no recomputation, required_operation: read canonical map identity exactly once at submission boundary, boundary_invariant: unknown ID raises rather than guesses, counterexample: ordinal n used as frame_id, test_id: test_frame_id_is_read_from_the_map_not_derived, status: correct}
  - {file: src/mfe/eval/metrics/final_score.py, line_or_symbol: r_at_k/compute_final_score, input_quantity: scorer outputs, output_quantity: R@1/5/20/50/100 and Final Score, current_operation: integer K thresholds and arithmetic mean, required_operation: official metric aggregation; no frame conversion, boundary_invariant: maximum 100 answers per query, counterexample: proxy Recall@K substituted for Final Score, test_id: test_default_k_matches_the_pdf, status: correct}
  - {file: src/mfe/eval/metrics/retrieval.py, line_or_symbol: summarize, input_quantity: recall/latency rows, output_quantity: display summaries, current_operation: round presentation values only, required_operation: retain raw per-query scores for A/B and uncertainty, boundary_invariant: rounded summary never drives frame identity, counterexample: tune on rounded held-out aggregate, test_id: test_measurement_summary_is_readable_without_a_strict_window, status: ambiguous}
property_tests:
  fps_values: [25.0, 30.0, 29.97, 26.44]
  frame_indices: [0, 1, 2, 29, 30, 100, 38049]
  assertions:
    - floor(pts_for_frame(frame_idx,fps)*fps) == frame_idx
    - frame_idx_from_pts(pts_time,fps) == math.floor(pts_time*fps)
    - equalize_budget <= floor(btc_count*guardrail_ratio)
    - inclusive_shot_start_and_end_are_not_dropped
    - timestamp_ms_rounding_never_changes_frame_idx
    - negative_nan_or_zero_FPS_fails_closed
    - duplicate_BTC_identity_retains_lowest_ordinal_canonical_alias
  test_files:
    - tests/unit/offline/keyframe_augmentation/test_gate0.py
    - tests/unit/offline/keyframe_augmentation/test_gate1.py
    - tests/unit/offline/keyframe_augmentation/test_transnet.py
    - tests/unit/offline/keyframe_augmentation/test_execution_spec_artifacts.py
unresolved_call_sites:
  - file: decoder-specific VFR integrations outside this checkout
    line_or_symbol: not_present_in_safe_local_corpus
    reason: no canonical VFR corpus/decoder timebase artifact
    status: ambiguous
