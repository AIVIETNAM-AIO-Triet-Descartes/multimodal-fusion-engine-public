# Sprint 1 — the only active config. Every path/model/threshold lives here,
# never in code (docs/01 §3.1, docs/00 §7).

paths:
  # --- INPUT: dataset giải nén vào data/sample/ (read-only, gitignored) -------
  # Cấu trúc do Kaggle "AI Challenge 2025" cấp sẵn. Xem data/README.md.
  videos: data/sample/videos/
  keyframes: data/sample/keyframes/          # ảnh keyframe cấp sẵn (Asset Store đọc từ đây)
  clip_features: data/sample/clip-features/  # .npy (n_keyframe, 512) float16 — không tự chạy CLIP
  map_keyframes: data/sample/map-keyframes/  # CSV: n, pts_time, fps, frame_idx — NGUỒN SỰ THẬT
  objects: data/sample/objects/              # object detection JSON
  media_info: data/sample/media-info/        # metadata JSON mỗi video
  # --- OUTPUT: kho ta sinh ra -------------------------------------------------
  segments: data/segments/                   # video_segment ta cắt (optional, docs/03 §3)
  vector_store: stores/vector/
  inverted_store: stores/inverted/
  relational_db: stores/relational/app.db
  eval_results: eval/results/
  throughput: eval/throughput.json

storage:
  backend: local                     # local | modal (docs/01 §3.2 — modal is a stub)

models:
  # Quốc Đạt fills these in. Left unset on purpose: picking a checkpoint is a Quốc Đạt
  # call, and Sprint 1 does not tune accuracy (docs/02 §1).
  clip: null                         # e.g. ViT-B-32 / laion2b_s34b_b79k
  detector: null
  ocr: null                          # null disables the OCR module (docs/02 §3)
  metadata: null

retrieval:
  embed_dim: 512
  coarse_topk: 500
  rerank_topk: 50
  # Scores from CLIP (cosine) and BM25 are on different scales — normalize
  # before weighting, do not add raw (docs/04 §3.1).
  fusion_weights:
    clip: 1.0
    bm25: 1.0
  # Over budget => skip rerank, fall back to coarse ranking (docs/04 §3.3).
  rerank_budget_ms: 3000

submit:
  # BTC schema is TO_CONFIRM. Switching format must not require a code change
  # (docs/05 §2). One of: by_timestamp | by_frame | by_frame_range | raw_keyframe
  schema_format: by_timestamp
  frame_range_window: 25             # only used by by_frame_range

eval:
  queryset: eval/queryset.jsonl
  recall_at: [1, 5, 10]
