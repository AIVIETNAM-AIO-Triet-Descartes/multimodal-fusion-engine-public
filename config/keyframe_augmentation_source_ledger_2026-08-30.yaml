claim_ledger:
  C-FINAL-SCORE-AUTHORITY:
    statement: official Final Score is the sole primary endpoint
    decision_effect: unchanged; proxy rows remain diagnostic_only
    evidence: [A0-RULE-001]
  C-FLOOR-MAPPING:
    statement: frame_idx_from_pts uses floor with literal mapping FPS
    decision_effect: accepted for newly decoded frames; copy canonical CSV identity when present
    evidence: [A0-RULE-001, A1-MAP-003]
  C-COVERAGE-IMPLIES-NO-HEADROOM:
    statement: temporal coverage alone proves no representative/ranking headroom
    decision_effect: rejected; O1-S and O1-R remain required
    evidence: [A1-DIAG-005]
  C-ANTI-CROWDING-HYPOTHESIS:
    statement: origin crowding can displace correct BTC results
    decision_effect: hypothesis only pending paired diagnostic/official A/B
    evidence: [D-REDDIT-022]

