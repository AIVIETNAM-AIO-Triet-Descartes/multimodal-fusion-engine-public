search_log:
  saturation_rule: >-
    Saturation is declared only after three query-expansion rounds in all six
    clusters, EN+VN variants, forward/backward citation chaining, and code/issue
    search for each priority method; forum results are discovery only.
  query_language: [EN, VN]
  accessed_at: 2026-08-30
  citation_chaining: forward_and_backward
  code_issue_search: each_priority_method
  clusters:
    - id: rules_eval
      queries: [AIC2026 BTC Final Score official, AIC2026 frame_id frame_idx floor, AIC2026 điểm Final Score khung hình]
      channels: [official_portal, local_pdf, GitHub_VN]
      rounds: 3
      date: 2026-08-30
      result_authority_grades: [A0, A1, C]
      result: local_A0_rule_and_A1_code_locked
      saturated: true
    - id: strong_teams
      queries: [VBS 2024 hall of fame system paper, LSC 2024 proceedings teams, đội mạnh VBS bài báo hệ thống]
      channels: [organizer_hall, organizer_teams, Springer, Lancaster_eprints]
      rounds: 3
      date: 2026-08-30
      result_authority_grades: [B]
      result: four_team_cards_with_verified_VBS_results
      saturated: true
    - id: candidate_methods
      queries: [TransNetV2 official inference predictions_to_scenes, U-CESE DAKE arXiv, chọn keyframe query aware]
      channels: [official_code, arXiv, OpenReview, HuggingFace]
      rounds: 3
      date: 2026-08-30
      result_authority_grades: [A2, C, D]
      result: TransNet_pinned; DAKE_candidate; emerging_sources_hypothesis_only
      saturated: true
    - id: retrieval_systems
      queries: [TRECVID AVS proceedings CLIP BLIP rerank, VBS OpenCLIP query server, FAISS BM25 video retrieval]
      channels: [NIST, VBS_Springer, official_code_docs, GitHub]
      rounds: 3
      date: 2026-08-30
      result_authority_grades: [B, A2, C]
      result: architecture_inspiration_no_metric_transfer
      saturated: true
    - id: oracle_eval
      queries: [best frame inside ground truth interval oracle, force rank retrieval ceiling, O1-S O1-R video retrieval]
      channels: [papers, OpenReview, local_eval_code, GitHub_issues]
