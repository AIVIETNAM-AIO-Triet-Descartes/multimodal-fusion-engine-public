# Toàn bộ batch 1 của BTC — 873 video, 178.195 keyframe.
#
# Tách khỏi `config/pilot.yaml` thay vì sửa nó: pilot trỏ vào `stores/pilot/`
# với 3 video lấy từ SOTA_AIC, và nó là mốc so sánh đang dùng được. Ghi đè lên
# đó là mất mốc.
#
# ═══════════════════════════════════════════════════════════════════════════
# KHO NÀY KHÔNG DỰNG BẰNG `mfe-ingest`.
#
# `mfe.offline.ingest` đòi một `ProvidedDataset` đầy đủ trên đĩa — ảnh keyframe,
# `objects/`, và `clip-features/{video}.npy` khớp từng dòng với `map-keyframes`.
# Với batch 1 là ~28 GB, và `clip-features` thì KHÔNG có trên Volume.
#
# Thay vào đó: `scripts/build_btc_relational.py` dựng bảng `videos`/`keyframes`
# từ hai thư mục nhỏ (~2 MB), còn 10 arm chính đọc Elasticsearch + Milvus. Hai
# kho local dưới đây (`vector_store`, `inverted_store`) CỐ Ý để rỗng — arm `clip`
# và `bm25` sẽ ngồi ngoài và nói rõ lý do trong bảng arm.
# ═══════════════════════════════════════════════════════════════════════════

paths:
  # Hai thư mục THẬT SỰ cần, kéo từ Volume về.
  map_keyframes: data/btc_b1/map-keyframes/   # NGUỒN SỰ THẬT cho frame_idx
  media_info: data/btc_b1/media-info/

  # Không tải về: ~28 GB, và tầng truy vấn không đọc chúng. Khai để `Config`
  # hợp lệ; thư mục rỗng thì arm tương ứng tự tắt kèm lý do.
  videos: data/btc_b1/videos/
  keyframes: data/btc_b1/keyframes/
  clip_features: data/btc_b1/clip-features/
  objects: data/btc_b1/objects/

  segments: data/segments_btc_b1/
  vector_store: stores/btc_b1/vector/
  inverted_store: stores/btc_b1/inverted/
  asset_store: stores/btc_b1/asset/
  relational_db: stores/btc_b1/relational/app.db
  eval_results: eval/results_btc_b1/
  throughput: eval/throughput_btc_b1.json
  event_log: eval/results_btc_b1/events.jsonl

storage:
  backend: local

models:
  clip: null
  detector: null
  ocr: null
  metadata: null
  # Stage C TẮT cho lượt đo đầu tiên trên toàn tập, hai lý do:
  #   1. Đo được 116 ms/ảnh trên CPU (`torch` trong venv là bản +cpu), tức
  #      ~12 giây/truy vấn. Trên 51 câu dev là 10 phút chỉ cho tầng cuối.
  #   2. Reranker chạy SAU khi gộp, nên nó làm nhoè đúng phép đo ta cần: arm nào
  #      đóng góp gì ở quy mô 873 video.
  # Bật lại sau khi có con số nền, và sau khi cài torch CUDA.
  reranker: null

features:
  source: provided
  object_score_min: 0.3
  metadata_fields: [title, keywords, author]

retrieval:
  embed_dim: 512
  coarse_topk: 500
  rerank_topk: 100                   # = trần 100 đáp án/truy vấn của BTC (§2.2)
  fusion:
    mode: rrf
  # ═══ Thiên kiến THỨ TỰ CẢNH cho KIS nhiều cảnh — bật 28-08-2026 ═══
  #
  # Tách câu thành mệnh đề, truy hồi từng mệnh đề, rồi thưởng video nào kể được
  # câu chuyện ĐÚNG THỨ TỰ THỜI GIAN (`mfe.online.scene_order` + `dante.align`).
  #
  # Đo trên 14 câu KIS ba cảnh (`eval/queryset_order_l30.jsonl`, video L30 chưa
  # câu dev/heldout nào đụng tới):
  #
  #                       RỘNG          hạng TB     lên/xuống
  #   nền                 0,800         10,3        —
  #   scene_order 0,5     0,843         4,2         4 / 0
  #
  # DANTE xếp ĐÚNG VIDEO lên hạng nhất ở 14/14 câu, trên 873 video. Kiểm chéo
  # qua `mfe.eval.official` (đường chạy thật, không phải script đo): 0,771 →
  # 0,814, cùng Δ +0,043.
  #
  # KHÔNG LÀM HỎNG, đo chứ không suy: trên 189 câu dev tầng chạm 4 câu (+0,050),
  # 111 câu KIS còn lại GIỮ NGUYÊN TỪNG CON SỐ. Trên heldout: 0/36 câu chạm tới.
  #
  # ĐỘ PHỦ THẤP, và đó là giới hạn thật: chỉ câu tách được ≥3 mệnh đề mới kích
  # hoạt (`MIN_CLAUSES_FOR_PRIOR`), vì câu 2 mệnh đề đo được là LUÔN gây hại —
  # với 2 mệnh đề, hai vị trí bất kỳ trong một video xếp đúng thứ tự với xác
  # suất ~½ nên ràng buộc tăng dần gần như không lọc gì. Đếm trên 38 đề KIS
  # thật: 21 câu có từ nối, 14 câu tách được ≥2, nhưng chỉ **3 câu** đạt ≥3.
  # Nút thắt là bộ luật tách dè dặt, không phải cơ chế — người vận hành tách tay
  # ở giao diện (`scene_order.clauses_from_texts`) là đường nâng độ phủ.
  #
  # GIÁ: chạy lại tầng A một lần MỖI MỆNH ĐỀ, tức 3× chi phí truy hồi — nhưng
  # chỉ trên câu thật sự kích hoạt; 111/115 câu dev thoát ra trước đó.
  scene_order_weight: 0.5

  # ═══ Tầng rerank cho LƯỢT NỘP — bật `vlm` 28-08-2026 (Lead quyết) ═══
  #
  # Đo lại 27-08 trên 163 câu dev, đúng nền đang dùng (0,515 · hạng TB 11,6):
  #
  #   vlm        0,530   +0,015   hạng TB 11,3   161/163   27,6 s/câu
  #   ta         0,506   −0,010   hạng TB 12,6   163/163   15,3 s/câu
  #   hf_cross   0,486   −0,029   hạng TB 13,2   138/163    8,8 s/câu
  #   colpali    0,482   −0,033   hạng TB 13,2   163/163   36,6 s/câu
  #
  # `vlm` là tầng DUY NHẤT dương. Ba tầng kia âm, nên danh sách này có đúng một
  # tên — không phải vì chưa thử, mà vì đã thử cả bốn.
  #
  # ⚠ PHẢI đặt `MFE_GEMINI_VLM_MODEL=gemini-flash-lite-latest` khi chạy.
  #   Mặc định của module là `gemini-3.6-flash`, mà free tier của nó cho **20
  #   request MỖI NGÀY** — với 49 đề thì nó chết ở câu thứ 21 và 28 câu còn lại
  #   giữ nguyên thứ tự cũ mà KHÔNG có gì đỏ lên trong file nộp. Con số +0,015
  #   ở trên đo bằng `flash-lite`, nên đó cũng là model duy nhất bảng này nói về.
  #
  # GIÁ: 20 ảnh/câu gửi lên API tính phí. 49 đề = 980 ảnh, ~23 phút cho cả lượt
  # nộp. Chấp nhận được cho một lượt nộp, KHÔNG chấp nhận được cho vòng lặp thử.
  rerank_tiers: [vlm]
  rerank_tier_depth: 20

  # `vlm` NGỒI NGOÀI câu đã có thiên kiến thứ tự cảnh — hai bên giẫm chân nhau.
  # Đo qua `mfe.eval.official` trên 14 câu KIS ba cảnh:
  #   thứ tự cảnh tắt, vlm tắt   0,771
  #   thứ tự cảnh BẬT, vlm tắt   0,814
  #   thứ tự cảnh bật, vlm BẬT   0,771   <- vlm xoá sạch phần vừa được
  # `vlm` dời 16/20 ứng viên mỗi câu. Thứ tự cảnh làm việc ở mức VIDEO (đẩy cả
  # cụm khung của video kể đúng chuyện lên), còn `vlm` xếp lại 20 khung đầu mà
  # không biết gì về trình tự — nó chỉ so từng ảnh với câu truy vấn.
  #
  # CHƯA ĐO: `vlm` + thứ tự cảnh trên 163 câu dev. Con số +0,015 của `vlm` đến
  # từ `measure_rerank.py`, vốn gộp cache evidence và KHÔNG gọi `Cascade.search`
  # — tức nó tả một hệ KHÔNG có thứ tự cảnh. Xem `docs/triet/handoff.md` §K.
  rerank_skip_when_scene_order: true

  # KHAI ĐỦ mọi arm, kể cả cái đang bằng 1.0 và cái chưa có dữ liệu.
  # `tune_weights.py` chỉ quét những khoá CÓ MẶT trong file này, nên arm không
  # khai là arm không bao giờ được chỉnh.
  #
  fusion_weights:
    # ═══ ĐO ĐƯỢC 24-08-2026 trên KHO PHẲNG, không đoán ═══
    #
    # Coordinate ascent trên 42 câu `eval/dev/*` (KIS+QA; 9 câu TRAKE để ngoài vì
    # chúng ghép qua DANTE), rồi CÔNG BỐ trên `eval/heldout/*` chưa từng đụng tới.
    #
    #                       dev RỘNG   dev hạngTB   dev trúng | held RỘNG  held HẸP
    #   đều 1.0 (siglip=2)    0,529        12,6        32/42   |   0,493     0,393
    #   sau leo dốc           0,610         9,4        34/42   |   0,563     0,430
    #
    # Heldout theo dạng đề: KIS 0,444→0,511 · QA 0,733→0,833 · TRAKE 0,156→0,178.
    # Thắng ở CẢ BA dạng, nên đây không phải một cấu hình vừa khít bộ dev.
    #
    # Tái lập:
    #   python scripts/tune_weights.py --config config/btc_b1.yaml \
    #     --queryset eval/queryset_dev.jsonl --skip-types TRAKE \
    #     --flat-root stores/flat --en-source auto \
    #     --evidence-cache .cache/tune/dev-kisqa-v2.json
    #
    # Lưới quét (0 · 0,5 · 1 · 2 · 4) + OFF, dừng sau 3 vòng. Đây là cực trị ĐỊA
    # PHƯƠNG trên lưới thô đó, không phải giá trị tối ưu; lưới mịn chưa quét.
    #
    # ── vì sao từng con số ───────────────────────────────────────────────────
    clip: 1.0
    bm25: 1.0

    # siglip 2.0 — arm gánh cả hệ. Chạy một mình: 34/42. Tắt nó đi thì Final tụt
    # 0,529 → 0,305 và chỉ còn 17/42. Ba arm văn bản DÌM nó khi trọng số đều nhau.
    # Quét: OFF 0,300 · 0,5 0,362 · 1,0 0,495 · 2,0 0,610 · 4,0 0,557.
    siglip: 2.0

    bge_m3: 1.0
    subtitle_partial: 1.0
    subtitle_exact: 1.0
    caption: 1.0

    # subtitle_bge_m3 0.0 — CHƯA ĐO. Nguồn `subtitles_dense.npz` (tầng
    # `n7_bge_m3_subtitles`) mới có trên Volume, chưa gộp về kho phẳng.
    #
    # Để 0,0 chứ không bỏ khoá: `build_flat_dense_arms` mặc định `weights.get(
    # name, 1.0)`, nên một arm mới KHÔNG khai ở đây sẽ lặng lẽ chạy ở trọng số
    # 1,0 và đổi hệ đem đi thi mà không ai quyết định điều đó. Khai 0,0 là cách
    # duy nhất để "đã thêm arm" khác với "đã chốt arm".
    #
    # `tune_weights.py` sẽ chốt con số thật trong lượt quét chung với
    # `caption_qwen` + `ocr_qwen25` sau khi lượt 5+6 gộp xong.
    subtitle_bge_m3: 0.0

    # ocr 0.0 — easyocr. KHÔNG phải "arm vô dụng": chạy một mình nó vẫn 17/42.
    # Nhưng trong hợp nhất nó đóng góp ÂM — bỏ đi Final tăng 0,529 → 0,571. Ba bộ
    # OCR đọc cùng những khung ấy, nên cái nhiễu nhất chỉ thêm phiếu cho thứ hạng
    # sai. Để 0.0 chứ không OFF: ứng viên của nó vẫn vào pool (bám đuôi, không
    # ghi điểm), tức vẫn lấp được chỗ trống ở trần 100 dòng của BTC.
    ocr: 0.0

    # ocr_paddle 0.5 — rụng dấu thanh (35,3% token có dấu) nên đọc kém, nhưng nó
    # đọc SẠCH logo và đồng hồ mà hai bộ kia làm hỏng. Nửa phiếu là đúng vai đó.
    ocr_paddle: 0.5
    ocr_vietocr: 1.0

    # object 0.0 — bản có SỐ ĐẾM và VỊ TRÍ, đo ngày 24-08. Chạy một mình 2/42, và
    # cả hai câu đó siglip đã tìm ra ở hạng 2 và 7. Trong hợp nhất: bỏ nó đi đổi
    # Final +0,000; để 1.0 thì MẤT 0,024.
    #
    # Nguyên nhân KHÔNG phải "lặp nhãn làm tài liệu dài". Đo idf trên chính chỉ
    # mục 168.009 tài liệu: `một` có mặt ở 91,0% (idf 0,09), `giữa` 89,4% (0,11),
    # `trái`/`phải` ~63% (0,45/0,47) — hai thứ vừa thêm vào là STOPWORD. Và chúng
    # là token TỰ DO: "bốn thức ăn" tách thành `bốn`+`thức`+`ăn`, nên `bốn` khớp
    # mọi khung có bốn *thứ gì đó*. Muốn có tác dụng phải ghép vào nhãn thành một
    # token (`ba_người`, `trái_người`) và viết lại truy vấn theo — chưa làm.
    object: 0.0

    # clap 0.5 — nó NGHE, không nhìn. Trên bộ dev toàn mô tả thị giác nó chạy một
    # mình chỉ 1/42, và 0,5 thắng 1,0 đúng 0,005 tức trong vùng nhiễu. Chưa có
    # câu hỏi nào về tiếng động để đo arm này bằng.
    clap: 0.5
  rerank_budget_ms: 20000
  rerank_depth: 100
  temporal_window_frames: 640
  dedup_depth: 20
  clip_checkpoint: clip-ViT-B-32
  clip_text_checkpoint: sentence-transformers/clip-ViT-B-32-multilingual-v1

  translation:
    enabled: true
    tiers: [mt]
    mt_checkpoint: VietAI/envit5-translation
    mt_num_beams: 1                  # greedy: chạy lại phải ra đúng số cũ
    cache_path: eval/translations.json

submit:
  schema_format: by_frame
  frame_range_window: 25

eval:
  queryset: eval/dev/
  recall_at: [1, 5, 20, 50, 100]
