change_scope_ledger:
  - owner: mfe.offline.keyframe_augmentation.oracle.OracleEvidenceRow
    files: [src/mfe/offline/keyframe_augmentation/oracle.py]
    rationale: canonical D6 field names, schema v2 emission and v1 input compatibility
    tests: [test_oracle_v2_canonical_fields_and_v1_aliases_are_compatible]
  - owner: mfe.offline.keyframe_augmentation.diagnostics
    files: [src/mfe/offline/keyframe_augmentation/diagnostics.py]
    rationale: fail-closed feature parity and required anti-crowding diagnostics
    tests: [test_feature_parity_requires_passing_frozen_numeric_canary_for_measured, test_crowding_reports_btc_displacement]
  - owner: mfe.offline.keyframe_augmentation.gate2.run_gate2
    files: [src/mfe/offline/keyframe_augmentation/gate2.py]
    rationale: deterministic paired cluster-bootstrap intervals and win/loss/tie evidence
    tests: [test_gate2_uses_official_score_equal_budget_noninferiority_and_latency]
  - owner: execution-spec manifests and validator tests
    files: [config, docs/research/keyframe-augmentation, tests/unit/offline/keyframe_augmentation]
    rationale: machine-readable D0-D14 compliance without touching BTC/live stores
    tests: [test_execution_spec_artifacts.py]
prohibited_actions:
  - mutate BTC map-keyframes or live stores
  - tune held-out
  - use mirror weights without provenance
  - run cloud or GPU workloads
  - commit or push
  - delete pre-existing dirty/untracked data
