# BUNDLE BTC — nhúng BẢN GHI CỬA SỔ bằng BGE-M3, BATCH 2
# notebooks/10.4-btc-bge-m3-window.ipynb  (cờ BATCH = 2)
#
# ═══════════════════════════════════════════════════════════════════════════
#   đọc   /bundle/aic_btc_b2_v1/parts/window_records/{video}.json
#   ghi   /bundle/aic_btc_b2_v1/parts/window_dense/{video}.npz
# ═══════════════════════════════════════════════════════════════════════════
#
# SINH BẰNG SCRIPT — `scratchpad/chia_shard_window_10.py`. Đừng sửa tay: bảng
# dưới đây cân theo SỐ CỬA SỔ (đơn vị công việc thật), không theo số video.
#
# 10 worker, tương ứng 10 tài khoản Kaggle × 2 phiên cho cả hai batch.
#
# Cân tải: 3,618 – 3,627 cửa sổ mỗi người, lệch
# 0.2% so với trung bình.
# Chia đều theo SỐ VIDEO sẽ lệch xa hơn nhiều — batch 1 có video 3 cửa sổ và
# video 183 cửa sổ, tức lệch 61 lần.
#
# ⚠ 43 video CHƯA có bản ghi cửa sổ (nb36 đang chạy tiếp). Chúng vẫn
# được chia, và nhận trung vị của nhóm mình làm ước lượng — bỏ chúng ra là lần
# sau phải chia lại toàn bộ. Notebook BỎ QUA video chưa có input và không coi
# đó là lỗi; bấm Run All lại sau.
#
# ⚠ Đổi bảng phân công là đổi `author` trong `part-manifest`: `write_part_manifest`
# luôn ghi đè `author` bằng người đang chạy (`bundle.py:953`), và
# `merge.check_ownership` từ chối cả bundle khi `author` khác người được giao.
# Lượt này gần như chưa ai chạy (batch 1 0/873, batch 2 3/614) nên đổi bây giờ
# là rẻ nhất.
